name: Scheduled Strat#5 scan

# Triggers app/api/cron/scan on a schedule so Discord alerts fire even when
# nobody has the Dashboard open. Requires two repo secrets (Settings >
# Secrets and variables > Actions):
#   SITE_URL     e.g. https://paldo.pages.dev (no trailing slash)
#   CRON_SECRET  must match the CRON_SECRET env var set on the deployment
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan
        run: |
          curl --fail-with-body --max-time 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/scan"
